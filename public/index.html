<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Bot or Not | בוט או לא</title>
  <meta name="description" content="5 texts a day. Some are human. Some are AI. Can you tell?" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Bot or Not" />
  <meta property="og:title" content="Bot or Not" />
  <meta property="og:description" content="5 texts a day. Some are human. Some are AI. Can you tell?" />
  <meta property="og:url" content="https://bot-or-not-810.pages.dev/" />
  <meta property="og:image" content="https://bot-or-not-810.pages.dev/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Bot or Not" />
  <meta name="twitter:description" content="5 texts a day. Some are human. Some are AI. Can you tell?" />
  <meta name="twitter:image" content="https://bot-or-not-810.pages.dev/og.png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="/assets/platforms.css" />
</head>
<body>
  <header id="topbar">
    <div id="brand">Bot or Not</div>
  </header>

  <main id="app">

    <!-- Screen 0: Landing -->
    <section id="screen-landing" class="screen active">
      <h1 data-i18n="landing_headline"></h1>
      <p class="sub" data-i18n="landing_sub"></p>
      <button id="btn-play" class="btn primary big" type="button" data-i18n="play_today"></button>
      <p id="landing-streak" class="streak-line hidden"></p>
      <p id="landing-stats" class="social-proof hidden"></p>
      <p id="landing-players" class="social-proof hidden"></p>
      <button id="landing-played" class="btn ghost hidden" type="button" data-i18n="played_today"></button>
      <p id="landing-countdown" class="countdown hidden"></p>
      <p id="landing-error" class="error hidden"></p>
    </section>

    <!-- Screens 1-5: The round (one card at a time) -->
    <section id="screen-card" class="screen">
      <div id="progress-dots" aria-hidden="true">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <p id="card-context" class="context-label"></p>
      <div id="swipe-wrap">
        <div id="card-text" class="card-frame"></div>
        <div id="stamp-human" class="stamp stamp-human" aria-hidden="true">HUMAN</div>
        <div id="stamp-bot" class="stamp stamp-bot" aria-hidden="true">BOT</div>
      </div>
      <p id="swipe-hint" class="swipe-hint hidden" data-i18n="swipe_hint"></p>
      <div class="answer-row">
        <button id="btn-human" class="btn answer human" type="button" data-i18n="human"></button>
        <button id="btn-bot" class="btn answer bot" type="button" data-i18n="bot"></button>
      </div>
      <button id="btn-back" class="btn ghost hidden" type="button" data-i18n="back"></button>
      <p id="scoring" class="scoring hidden" data-i18n="scoring"></p>
      <p id="practice-banner" class="practice hidden" data-i18n="practice_banner"></p>
    </section>

    <!-- Screen 6: Reveal -->
    <section id="screen-reveal" class="screen">
      <h2 data-i18n="reveal_title"></h2>
      <div id="reveal-list"></div>
      <button id="btn-to-score" class="btn primary big" type="button" data-i18n="see_score"></button>
    </section>

    <!-- Screen 7: Score card -->
    <section id="screen-score" class="screen">
      <h2 id="score-line"></h2>
      <div id="score-grid" class="emoji-grid" aria-hidden="true"></div>
      <p id="score-streak" class="streak-line"></p>
      <p id="score-percentile" class="money-line"></p>
      <p id="score-players" class="players-line"></p>
      <p id="replay-note" class="players-line hidden" data-i18n="replay_note"></p>
      <div class="share-row">
        <button id="btn-share-x" class="btn primary" type="button" data-i18n="share_x"></button>
        <button id="btn-share-linkedin" class="btn primary" type="button" data-i18n="share_linkedin"></button>
        <button id="btn-share" class="btn ghost" type="button" data-i18n="share_more"></button>
        <button id="btn-tomorrow" class="btn ghost" type="button" data-i18n="see_you_tomorrow"></button>
      </div>
      <p id="countdown" class="countdown hidden"></p>
      <canvas id="share-canvas" width="1080" height="1080" class="hidden"></canvas>

      <div class="below-fold">
        <button id="archive-toggle" class="archive-toggle" type="button" aria-expanded="true">
          <span data-i18n="archive_title"></span><span class="chevron">▾</span>
        </button>
        <div id="archive-body">
          <p class="muted" data-i18n="archive_note"></p>
          <div id="archive-list"></div>
        </div>
      </div>
    </section>

  </main>

  <script src="/assets/i18n.js"></script>
  <script src="/assets/cards.js"></script>
  <script src="/assets/share.js"></script>
  <script src="/assets/app.js"></script>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
